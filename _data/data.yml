experiences:
  title: Doświadczenie
  info:
  - role: Pracownik porządkowy
    time: 2024 - 2026
    company: Grupa Ever, Kraków
    details: |
        - Utrzymanie czystości i porządku w wyznaczonych obszarach zgodnie z obowiązującymi standardami.
        - Dbanie o estetykę i higienę pomieszczeń użytkowych oraz zaplecza.
        - Obsługa podstawowego sprzętu i środków czystości zgodnie z zasadami bezpieczeństwa.
        - Regularne uzupełnianie materiałów higienicznych i środków eksploatacyjnych.
        - Organizacja pracy własnej i wykonywanie obowiązków zgodnie z harmonogramem.
        - Współpraca z zespołem w zapewnieniu wysokiego standardu czystości obiektu.
        - Przestrzeganie zasad BHP oraz procedur wewnętrznych.
  - role: Sprzedawca / Kasjer
    time: 2022 - 2023
    company: Biedronka, Kraków
    details: |
        - Profesjonalna obsługa klientów zgodnie ze standardami sprzedaży i jakości obsługi.
        - Obsługa kasy fiskalnej oraz terminala płatniczego, realizacja transakcji gotówkowych i bezgotówkowych.
        - Doradzanie klientom w zakresie produktów oraz wspieranie decyzji zakupowych.
        - Dbanie o prawidłową ekspozycję towarów i uzupełnianie stanów magazynowych na sali sprzedaży.
        - Kontrola terminów ważności produktów i utrzymanie standardów jakości.
        - Przyjmowanie dostaw, rozkładanie towaru oraz organizacja przestrzeni magazynowej.
        - Współpraca z zespołem w realizacji celów sprzedażowych sklepu.
  - role: Przedstawiciel ds. Sprzedaży
    time: 2020 - 2021
    company: TTEC, Kraków
    details: |
        - Nawiązywanie i utrzymywanie długoterminowych relacji biznesowych z nowymi klientami.
        - Opracowywanie spersonalizowanych strategii reklamy internetowej dla nowych i obecnych klientów.
        - Doradzanie klientom w zakresie Google Ads, w tym proponowanie nowych rozwiązań, negocjowanie ofert oraz edukowanie ich na temat produktów Google Ads.
        - Zarządzanie wszystkimi aspektami Google Ads, w tym konfiguracją kampanii, przebudową istniejących kampanii oraz monitorowaniem, optymalizacją i raportowaniem wyników. 
        - Sprzedaż produktów i rozwiązań Google Ads (inside sales, upselling, cross-selling) oraz ciągła analiza wyników w celu realizacji wyznaczonych celów.
        - Współpraca z pracownikami różnych działów w celu przygotowywania rozwiązań dla klientów oraz rozwijania ich kampanii w trakcie obsługi klienta.
        - Realizacja wymagań dotyczących produktywności (KPI) przy jednoczesnym byciu graczem zespołowym wspierającym realizację wspólnych celów sprzedażowych zespołu.
  - role: Programista/Lider zespołu
    time: 2018 - 2019
    company: Fru S.A., Poznań, Kraków
    details: |
        - Współpraca w międzynarodowym zespole Agile przy rozwoju flagowego systemu rozproszonego obsługującego ponad 1 milion wyświetleń dziennie, z naciskiem na optymalizację mikroserwisów płatności i zamówień.
        - Planowanie projektów oraz rozbijanie ich na poszczególne zadania zgodnie z założeniami technicznymi przy zachowaniu potrzeb biznesowych.
        - Kierowanie zespołem programistów.
        - Wsparcie i komunikacja międzywydziałowa.
        - Prowadzenie warsztatów technicznych.
        - Reprezentowanie zespołu podczas spotkań.
  - role: Programista
    time: 2016 - 2017
    company: IamIP Technology Sp z o.o., Poznań
    details: |
        - Praca w międzynarodowym zespole nad skonteneryzowanymi mikroserwisami platformy patentowej. Wykorzystanie chmury AWS, systemów kolejkowania i komunikacji wiadomości, testowania, monitorowania oraz intensywna praca z technologią ElasticSearch.
  - role: Programista
    time: 2014 - 2015
    company: AtomScript Sp. z.o.o., Poznań
    details: |
        - Rozwój oprogramowania "Syllabus" wykorzystywanego przez polskie uczelnie wyższe.
        - Rozwój oprogramowania dla znanej kancelarii prawnej.
        - Nawiązywanie oraz utrzymywanie relacji z nowymi oraz istniejącymi klientami.
        - Wsparcie działań sprzedażowych.
        - Dowodzenie zespołem programistów i wypracowywanie strategii dalszego rozwoju oprogramowania.

