experiences:
  title: Experience
  info:
  - role: Digital Sales Representative
    time: 2025 - 2026
    company: TTEC, Cracow
    details: |
        - Establishing and maintaing long-term business relationships with the new Clients
        - Developing customized online advertising strategies for individual new and existing clients.
        - Provide guidance to clients on Google Ads-related matters, including proposing new solutions, negotiating offers, and educating them about Google Ads products.
        - Managing all aspects of Google Ads, including campaign setup, rebuild existing campaigns, and monitor, optimize, and report on results.
        - Selling Google Ads products and solutions (inside sales, upselling, cross selling), continuously analyzing results to ensure the achievement of set goals. 
        - Collaborating with employees from various departments to prepare solutions for clients and develop their campaigns during the customer service period.
        - Meeting your personal productivity requirements (KPIs) daily while being a team player contributing to the overall team sales targets.
  - role: Software Engineer/Team Leader
    time: 2022 - 2024
    company: LGHTNNG, Poznan, Cracow
    details: |
        - Acquiring new B2B contracts and maintaining relationships with existing contractors for software development services.
        - Working collaboratively in an Agile/Scrum environment.
        - Developing software solutions for company clients.
        - Creating Jira based project roadmaps and breaking them down into individual tasks.
        - Supporting problem-solving, conflict resolution, and project task planning and allocation.
        - Assisting with interdepartmental communication throughout project execution.
        - Reporting project progress to management.
        - Managing the team and developing strategies for further growth and development.
        - Handling phone and email communication with clients.
  - role: Software Engineer/Team Leader
    time: 2019 - 2021
    company: AtomScript Sp. z.o.o., Poznan
    details: |
        - Development of the “Syllabus” software used by Polish universities.
        - Development of software for a well-known law firm.
        - Establishing and maintaining relationships with new and existing clients.
        - Supporting sales activities.
        - Leading a team of developers and defining strategies for further software development.
  - role: Warehouse picker
    time: 2018 - 2019
    company: Amazon, Poznan
    details: |
        - Working with handheld scanner to retrieve customer items from storage to fulfill orders.

